name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Stamp version.json in workspace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess

          root = pathlib.Path(".")
          ver_path = root / "scripts/data/version.json"
          default_open = "36fb882c9db3b6cd8a83f072d2dfec51d4acedca"
          ver = {
              "epoch": 0,
              "series": 2,
              "patch": 0,
              "label": "0.2.0",
              "open_commit": default_open,
          }
          if ver_path.is_file():
              ver.update(json.loads(ver_path.read_text(encoding="utf-8")))
          epoch = int(ver.get("epoch", 0))
          series = int(ver.get("series", 2))
          baked_patch = int(ver.get("patch", 0))
          open_sha = str(ver.get("open_commit") or default_open).strip()

          def git(*args) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          last_ver = ""
          try:
              last_ver = git("log", "-1", "--format=%H", "--", "scripts/data/version.json")
          except subprocess.CalledProcessError:
              last_ver = ""
          since = last_ver if last_ver else open_sha
          try:
              subjects = git("log", "--format=%s", f"{since}..HEAD")
          except subprocess.CalledProcessError:
              subjects = ""
          user_after = 0
          for line in subjects.splitlines():
              msg = line.strip()
              if not msg:
                  continue
              if "[skip ci]" in msg:
                  continue
              if msg.startswith("chore: stamp "):
                  continue
              user_after += 1
          patch = baked_patch + user_after
          if patch < baked_patch:
              patch = baked_patch
          payload = {
              "epoch": epoch,
              "series": series,
              "patch": patch,
              "label": f"{epoch}.{series}.{patch}",
              "open_commit": open_sha,
          }
          ver_path.parent.mkdir(parents=True, exist_ok=True)
          ver_path.write_text(json.dumps(payload, indent="\t") + "\n", encoding="utf-8")
          print("workspace stamp", payload["label"])
          PY
          python3 tools/build_changelog.py

      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fsSL -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q godot.zip
          GODOT_BIN="$(find "$PWD" -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d /tmp/godot-tpl
          if [ -d /tmp/godot-tpl/templates ]; then
            mv /tmp/godot-tpl/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          else
            mv /tmp/godot-tpl/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          fi

      - name: Export live Web
        run: |
          set -euo pipefail
          SITE="$PWD/site"
          mkdir -p "$SITE"
          "$GODOT_BIN" --headless --path "$PWD" --import
          "$GODOT_BIN" --headless --path "$PWD" --export-release Web "$SITE/index.html"
          python3 tools/web_postexport.py "$SITE"
          touch "$SITE/.nojekyll"

      - name: Restore archive export cache
        id: archive-cache
        uses: actions/cache/restore@v6
        with:
          path: .archive_export_cache
          key: wdb-pages-archives-${{ hashFiles('scripts/data/archive_catalog.json') }}
          restore-keys: |
            wdb-pages-archives-

      - name: Export archives
        run: |
          set -euo pipefail
          python3 tools/export_archives.py \
            --root "$PWD" \
            --site "$PWD/site" \
            --godot "$GODOT_BIN" \
            --cache "$PWD/.archive_export_cache" \
            --worktrees "$PWD/.archive_worktrees"

      - name: Save archive export cache
        if: steps.archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .archive_export_cache
          key: wdb-pages-archives-${{ hashFiles('scripts/data/archive_catalog.json') }}

      - name: Publish changelog pages
        run: |
          python3 - <<'PY'
          import html, pathlib, re
          root = pathlib.Path(".")
          src = root / "design" / "changelog"
          dest = root / "site" / "changelog"
          dest.mkdir(parents=True, exist_ok=True)
          files = sorted(src.glob("*.md"), key=lambda p: p.stem, reverse=True) if src.is_dir() else []
          blocks = []
          for path in files:
              raw = path.read_text(encoding="utf-8")
              player, _, _ = raw.partition("\n## Agent")
              body = html.escape(player.strip())
              blocks.append(f"<section><pre>{body}</pre></section>")
              (dest / f"{path.stem}.html").write_text(
                  "<!doctype html><meta charset=utf-8><title>%s</title><pre>%s</pre>"
                  % (html.escape(path.stem), body),
                  encoding="utf-8",
              )
          index = """<!doctype html>
          <meta charset=utf-8>
          <title>What Dwells Below — changelog</title>
          <style>
          body{background:#111;color:#ddd;font:16px/1.4 sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem}
          h1{color:#e6c36a}
          pre{white-space:pre-wrap;background:#1a1612;padding:1rem;border:1px solid #3a3024}
          section{margin:0 0 1.5rem}
          </style>
          <h1>What Dwells Below — changelog</h1>
          %s
          """ % ("\n".join(blocks) if blocks else "<p>No notes yet.</p>")
          (dest / "index.html").write_text(index, encoding="utf-8")
          print("wrote", dest)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5