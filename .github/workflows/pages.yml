name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fsSL -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q godot.zip
          GODOT_BIN="$(find "$PWD" -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d /tmp/godot-tpl
          if [ -d /tmp/godot-tpl/templates ]; then
            mv /tmp/godot-tpl/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          else
            mv /tmp/godot-tpl/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          fi

      - name: Export live + archives
        run: |
          set -euo pipefail
          SITE="$PWD/site"
          mkdir -p "$SITE"
          "$GODOT_BIN" --headless --path "$PWD" --import
          "$GODOT_BIN" --headless --path "$PWD" --export-release Web "$SITE/index.html"
          touch "$SITE/.nojekyll"
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          root = os.getcwd()
          site = os.path.join(root, "site")
          godot = os.environ["GODOT_BIN"]
          cat = json.load(open("scripts/data/archive_catalog.json", encoding="utf-8"))
          def run(cmd):
              print("+", " ".join(cmd), flush=True)
              subprocess.check_call(cmd)
          def stamp(path, label):
              text = open(path, encoding="utf-8").read()
              named = f'What Dwells Below — {label}'
              text, n = re.subn(r'config/name="[^"]*"', f'config/name="{named}"', text, count=1)
              if n != 1:
                  raise SystemExit(f"could not stamp name in {path}")
              open(path, "w", encoding="utf-8", newline="\n").write(text)
          for e in cat["archives"]:
              aid, sha, label, slug = e["id"], e["commit"], e["label"], e["pages_slug"]
              wt = os.path.join("/tmp", f"wdb-arch-{aid}")
              if os.path.exists(wt):
                  subprocess.call(["git", "worktree", "remove", "--force", wt])
              run(["git", "worktree", "add", "--detach", wt, sha])
              stamp(os.path.join(wt, "project.godot"), label)
              dest = os.path.join(site, *slug.split("/"))
              os.makedirs(dest, exist_ok=True)
              html = os.path.join(dest, "index.html")
              run([godot, "--headless", "--path", wt, "--import"])
              run([godot, "--headless", "--path", wt, "--export-release", "Web", html])
              subprocess.call(["git", "worktree", "remove", "--force", wt])
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
