# gdhealth config for `python tools/release.py graphs` (gdhealth reads this file from the repo root).
# One group per routes.yaml door work area; a group lists the same files as that door's design/code-map.md row.
# Groups match in alphabetical order, first match wins, so every group carves its neighbours out with "!" globs.
# A file no group matches reports as "ungrouped": that area is not organized yet.

[discovery]
include = ["**/*.gd"]
exclude = ["addons/**", ".godot/**", "reports/**"]

[groups]
camera        = ["scripts/world/camera_rig.gd", "scripts/world/sprite_filter.gd"]
combat        = ["scripts/combat/**", "!scripts/combat/enemy.gd", "!scripts/combat/enemy/**", "!scripts/combat/roster.gd"]
debug         = ["scripts/debug/**"]
enemies       = ["scripts/combat/enemy.gd", "scripts/combat/enemy/**", "scripts/combat/roster.gd"]
inventory     = ["scripts/data/progress_gear.gd", "scripts/data/progress_gear/**", "scripts/data/gear_rules/**", "scripts/data/affixes.gd", "scripts/data/gear_roll.gd", "scripts/data/catalog.gd", "scripts/data/item_names.gd"]
interactables = ["scripts/world/interact.gd", "scripts/world/interact/**", "scripts/world/gather/**", "scripts/world/breakable.gd", "scripts/world/pickup.gd", "scripts/world/floor_crystal.gd"]
numbers       = ["scripts/data/balance.gd", "scripts/data/balance/**", "scripts/data/tunables.gd"]
player        = ["scripts/world/player.gd", "scripts/world/player/**", "scripts/world/facing.gd", "scripts/world/bow_mode.gd"]
save_tech     = ["scripts/data/save_store.gd", "scripts/data/save_store/**"]
skills        = ["scripts/data/progress_combat.gd", "scripts/data/progress_combat/**", "scripts/data/progress_forge.gd", "scripts/data/progress_forge/**"]

# Pinned to the gdhealth 0.3.6 defaults so trend numbers do not move with a tool update.
[thresholds]
file_lines_warn         = 500
file_lines_critical     = 1000
function_lines_warn     = 40
function_lines_critical = 80
cyclomatic_warn         = 10
cyclomatic_critical     = 15
nesting_warn            = 4
nesting_critical        = 6
parameters_warn         = 5

[policy]
# Only single-file self-factories (a static spawn that does `load(<own path>).new()`), named one by one.
allow_cycles = [
	"scripts/combat/float_num.gd",
	"scripts/combat/hp_bar.gd",
]

# Live code never depends on debug code.
[[policy.forbidden_dependencies]]
from     = "combat"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "enemies"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "player"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "camera"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "interactables"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "skills"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "save_tech"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "numbers"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "inventory"
to       = "debug"
severity = "critical"

# Combat mechanics (hits, cover, projectiles, feedback) sit below the enemies that use them.
[[policy.forbidden_dependencies]]
from     = "combat"
to       = "enemies"
severity = "warning"

# The player reaches enemies only through combat (lock, hits).
[[policy.forbidden_dependencies]]
from     = "player"
to       = "enemies"
severity = "warning"

# Camera and sprite filtering sit below every actor that uses them.
[[policy.forbidden_dependencies]]
from     = "camera"
to       = "player"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "camera"
to       = "combat"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "camera"
to       = "enemies"
severity = "warning"

# Interactables are placed by the dungeon and the hub and used by the player; they reach no actor code.
[[policy.forbidden_dependencies]]
from     = "interactables"
to       = "player"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "interactables"
to       = "enemies"
severity = "warning"

# Skill math reads progress state; it never loads or writes the save itself.
[[policy.forbidden_dependencies]]
from     = "skills"
to       = "save_tech"
severity = "warning"

# Numbers are a leaf: they read the pref defaults (save_tech) and nothing from the systems they tune.
[[policy.forbidden_dependencies]]
from     = "numbers"
to       = "combat"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "numbers"
to       = "enemies"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "numbers"
to       = "player"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "numbers"
to       = "interactables"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "numbers"
to       = "skills"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "numbers"
to       = "camera"
severity = "warning"

# Item data sits below the systems that use items.
[[policy.forbidden_dependencies]]
from     = "inventory"
to       = "player"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "inventory"
to       = "combat"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "inventory"
to       = "enemies"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "inventory"
to       = "interactables"
severity = "warning"

[[policy.forbidden_dependencies]]
from     = "inventory"
to       = "save_tech"
severity = "warning"
