to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "audio_visual"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "localization"
to       = "debug"
severity = "critical"

# App flow is the top of the game; it reaches debug only through the Dbg shim (scripts/app/dbg.gd, lazy loads).
[[policy.forbidden_dependencies]]
from     = "app_flow"
to       = "debug"
