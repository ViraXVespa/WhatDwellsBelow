# gdhealth config for `python tools/release.py graphs` (gdhealth reads this file from the repo root).
# One group per routes.yaml door work area; a group lists the same files as that door's design/code-map.md row.
# Groups match in alphabetical order, first match wins, so every group carves its neighbours out with "!" globs.
# A file no group matches reports as "ungrouped": that area is not organized yet.

[discovery]
include = ["**/*.gd"]
exclude = ["addons/**", ".godot/**", "reports/**"]

[groups]
app_flow      = ["scripts/app.gd", "scripts/app/**", "scripts/boot.gd", "scripts/title.gd", "scripts/title/**", "scripts/data/bug_doors.gd"]
archives      = ["scripts/ui/archives_ui.gd", "scripts/ui/archives_ui/**", "scripts/data/archives/**"]
audio_visual = ["scripts/audio/**"]
camera        = ["scripts/world/camera_rig.gd", "scripts/world/sprite_filter.gd", "scripts/world/depth.gd"]
combat        = ["scripts/combat/**", "!scripts/combat/enemy.gd", "!scripts/combat/enemy/**", "!scripts/combat/roster.gd"]
debug         = ["scripts/debug/**"]
dungeon       = ["scripts/dungeon/**", "scripts/world/dungeon.gd", "scripts/world/dungeon/**", "scripts/world/dungeon_geo.gd", "scripts/world/dungeon_geo/**", "scripts/world/dungeon_props.gd", "scripts/world/dungeon_props/**", "scripts/world/dungeon_stream.gd", "scripts/world/dungeon_stream/**", "scripts/world/crystal/**", "scripts/world/floor_crystal.gd", "scripts/world/wall_rects.gd", "scripts/world/boss_door.gd"]
display       = ["scripts/display_mode.gd", "scripts/display_mode/**"]
enemies       = ["scripts/combat/enemy.gd", "scripts/combat/enemy/**", "scripts/combat/roster.gd"]
gear_ui       = ["scripts/ui/gear_board.gd", "scripts/ui/gear_board/**", "scripts/ui/gear_icons.gd"]
input         = ["scripts/input/**"]
interactables = ["scripts/world/interact.gd", "scripts/world/interact/**", "scripts/world/gather/**", "scripts/world/breakable.gd", "scripts/world/pickup.gd"]
inventory     = ["scripts/data/progress_gear.gd", "scripts/data/progress_gear/**", "scripts/data/gear_rules/**", "scripts/data/affixes.gd", "scripts/data/gear_roll.gd", "scripts/data/catalog.gd", "scripts/data/item_names.gd"]
localization  = ["scripts/localization/**"]
numbers       = ["scripts/data/balance.gd", "scripts/data/balance/**", "scripts/data/tunables.gd"]
player        = ["scripts/world/player.gd", "scripts/world/player/**", "scripts/world/facing.gd", "scripts/world/bow_mode.gd"]
save_tech     = ["scripts/data/save_store.gd", "scripts/data/save_store/**"]
skills        = ["scripts/data/progress_combat.gd", "scripts/data/progress_combat/**", "scripts/data/progress_forge.gd", "scripts/data/progress_forge/**"]
ui            = ["scripts/ui/**", "scripts/data/tutorial_pages.gd", "!scripts/ui/archives_ui.gd", "!scripts/ui/archives_ui/**", "!scripts/ui/gear_board.gd", "!scripts/ui/gear_board/**", "!scripts/ui/gear_icons.gd"]

# Pinned to the gdhealth 0.3.6 defaults so trend numbers do not move with a tool update.
[thresholds]
file_lines_warn         = 500
file_lines_critical     = 1000
function_lines_warn     = 40
function_lines_critical = 80
cyclomatic_warn         = 10
cyclomatic_critical     = 15
nesting_warn            = 4
nesting_critical        = 6
parameters_warn         = 5

[policy]
# Only single-file self-factories (a static spawn that does `load(<own path>).new()`), named one by one.
allow_cycles = [
	"scripts/combat/float_num.gd",
	"scripts/combat/hp_bar.gd",
]

# Live code never depends on debug code.
[[policy.forbidden_dependencies]]
from     = "combat"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "enemies"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
from     = "player"
to       = "debug"
severity = "critical"

[[policy.forbidden_dependencies]]
