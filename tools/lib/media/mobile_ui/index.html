<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#17141d">
  <title>Pipeline Studio</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <div id="sim-banner" class="sim-banner" hidden>Practice mode &middot; made-up results; nothing reaches the game</div>
  <header class="top">
    <button id="back" class="icon-btn" aria-label="Back" hidden>&#8249;</button>
    <h1 id="title">Pipeline Studio</h1>
    <button id="jobs-pill" class="pill" hidden></button>
  </header>
  <main id="view" class="view"><p class="muted pad">Loading&hellip;</p></main>
  <nav class="tabs" aria-label="Sections">
    <a href="#/" data-tab="home">Home<span id="tab-pending" class="dot-count" hidden></span></a>
    <a href="#/coverage" data-tab="coverage">Coverage</a>
  </nav>
  <div id="sheet-back" class="sheet-back" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
